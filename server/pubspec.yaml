name: drakkar_api
description: Drakkar REST API (Dart + shelf + PostgreSQL), built to run on DigitalOcean Kubernetes.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  bcrypt: ^1.1.3
  crypto: ^3.0.3
  drakkar_core:
    path: ../core
  postgres: ^3.4.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
