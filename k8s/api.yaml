apiVersion: apps/v1
kind: Deployment
metadata:
  name: drakkar-api
  labels:
    app: drakkar-api
spec:
  # No `replicas:` here on purpose. The HPA (scaling.yaml) owns the replica
  # count; if it were set, every `kubectl apply` would reset a scaled-out
  # Deployment back to that number.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: drakkar-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # add one new pod at a time...
      maxUnavailable: 0            # ...and never drop below desired capacity
  template:
    metadata:
      labels:
        app: drakkar-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: drakkar-api
      containers:
        - name: api
          image: drakkar-api        # rewritten by kustomization.yaml
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_POOL_SIZE
              # 5 pods (HPA max) x 3 = 15 connections. The 1 GiB DO Postgres plan
              # allows 22, leaving room for the migrate Job and an admin session.
              value: "3"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: drakkar-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:            # "send me traffic?" — checks the database
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3          # default is 1s; too tight under CPU load
            failureThreshold: 3
          livenessProbe:             # "restart me?" — process only, not the DB
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keep serving briefly while the load balancer stops routing here.
              # (Native sleep action: the scratch image has no shell.)
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: drakkar-api
  labels:
    app: drakkar-api
spec:
  selector:
    app: drakkar-api
  ports:
    - name: http
      port: 8080
      targetPort: http
