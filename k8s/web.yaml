apiVersion: apps/v1
kind: Deployment
metadata:
  name: drakkar-web
  labels:
    app: drakkar-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drakkar-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: drakkar-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101               # nginx user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: drakkar-web          # rewritten by kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://drakkar-api:8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx renders its config and writes temp files at startup;
            # give it small writable scratch dirs instead of a writable image.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: drakkar-web
  labels:
    app: drakkar-web
spec:
  selector:
    app: drakkar-web
  ports:
    - name: http
      port: 8080
      targetPort: http
