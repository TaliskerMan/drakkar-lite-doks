# kubectl apply -k k8s
# Before the first apply run: scripts/set_registry.sh <registry> <tag>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drakkar
labels:
  - pairs:
      app.kubernetes.io/part-of: drakkar-lite
resources:
  - namespace.yaml
  - api.yaml
  - web.yaml
  - gateway.yaml
  - scaling.yaml
images:
  - name: drakkar-api
    newName: registry.digitalocean.com/YOUR_REGISTRY/drakkar-api
    newTag: v0.1.0
  - name: drakkar-web
    newName: registry.digitalocean.com/YOUR_REGISTRY/drakkar-web
    newTag: v0.1.0
